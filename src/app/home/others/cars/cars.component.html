<div class="container-fluid pt-4 pb-5">
  <div class="container">
    <h1 class="xxl-text text-center">Masinile noastre</h1>
    <div
      class="slider overflow-auto user-select-none"
      #slider
      (mouseleave)="mouseleave()"
      (mouseup)="mouseup()"
      (mousedown)="mousedown($event)"
      (mousemove)="mousemove($event)"
    >
      <div class="slider-track gap-3">
        <ng-container *ngFor="let car of cars.concat(cars)">
          <div class="car-wrapper d-flex flex-column bg-white">
            <img
              class="car-image flex-grow-1"
              draggable="false"
              [alt]="car.name"
              [src]="carImage(car.name)"
            />
            <div class="car-description p-4">
              <p class="lg-text fw-bold">{{ car.name }}</p>
              <p></p>
              <div class="car-details">
                <p class="pe-3 me-3">{{ car.seats }} locuri</p>
                <p class="pe-3 me-3">{{ car.engine }}</p>
                <p class="pe-3 me-3">{{ car.transmission }}</p>
                <p class="me-auto fw-bold car-rent-price">
                  {{ car.rate | currency: "EUR" : "symbol" : "" : "en-gb" }} /
                  zi
                </p>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
